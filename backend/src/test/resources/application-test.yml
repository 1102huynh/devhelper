spring:
  application:
    name: devhelper-backend-test

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: 0  # Random port for testing

logging:
  level:
    com.devhelper: DEBUG
    org.springframework.web: INFO
    org.hibernate: WARN

