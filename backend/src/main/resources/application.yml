spring:
  application:
    name: devhelper-backend

  jackson:
    default-property-inclusion: non_null
    serialization:
      indent_output: true

# Firebase Configuration (Disabled - Using File Storage)
firebase:
  enabled: false
  credentials-path: classpath:abc.json
  database-url: https://test-c3845-default-rtdb.firebaseio.com

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# CORS Configuration
cors:
  allowed-origins: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

logging:
  level:
    com.devhelper: DEBUG
    org.springframework.web: INFO
